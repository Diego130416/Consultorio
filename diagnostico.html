<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registrar Diagnóstico</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="messageBox" class="message" aria-live="polite" style="display:none"></div>

  <header class="header">
    <div class="brand">
      <h1>Consultorio Médico</h1>
      <p class="subtitle">Agenda e Historial de Pacientes</p>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="paciente.html" class="nav-link">Registrar Paciente</a>
      <a href="historial.html" class="nav-link">Historial</a>
      <a href="receta.html" class="nav-link">Receta</a>
      <a href="pago.html" class="nav-link">Pago</a>
      <a href="diagnostico.html" class="nav-link active">Diagnóstico</a>
      <a href="estudio.html" class="nav-link">Estudio</a>
      <a href="reporte.html" class="nav-link">Reporte</a>
      <a href="config.html" class="nav-link">Configuración</a>
    </nav>
  </header>

  <main class="form-container">
    <form id="diagnosisForm" class="card">
      <fieldset>
        <legend>Diagnóstico del Paciente</legend>
        <label>Paciente
          <select id="patientSelect" required>
            <option value="">Cargando pacientes...</option>
          </select>
        </label>
        <label>Diagnóstico Principal
            <input id="diagnosisTitle" type="text" required placeholder="Ej. Esguince de tobillo grado II" />
        </label>
        <label>Descripción y Plan
            <textarea id="diagnosisDescription" rows="8" placeholder="Paciente refiere inversión forzada de tobillo derecho... Se indica reposo, hielo, compresión y elevación (RICE). Cita de seguimiento en 7 días."></textarea>
        </label>
      </fieldset>
      <div class="form-actions">
        <button type="submit" class="btn primary">Guardar e Imprimir Diagnóstico</button>
      </div>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
