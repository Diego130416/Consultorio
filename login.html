<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar Sesión - Consultorio Médico</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* Estilos específicos para centrar el login */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg); /* Fondo gris claro */
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      margin: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-md);
    }
    .login-header h1 {
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin: 0;
    }
    /* El "card" aquí no tendrá el efecto hover */
    .login-container .card:hover {
      transform: none;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="Logo.jfif" alt="Logo Consultorio Médico" />
      <h1>Bienvenido</h1>
      <p class="subtitle" style="font-size: 1rem;">Acceso al panel de administración</p>
    </div>

    <div class="card">
      <form id="loginForm">
        <!-- Contenedor para mensajes de error (diferente al global) -->
        <div id="loginMessageBox" class="message error" style="display:none; margin-bottom: 1rem;"></div>

        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej. medico" required>
        
        <label for="password" style="margin-top: 1rem;">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        
        <div class="form-actions" style="margin-top: 1.5rem;">
          <button type="submit" class="btn primary" style="width: 100%;">
            <i class="fas fa-sign-in-alt"></i> &nbsp; Iniciar Sesión
          </button>
        </div>
      </form>
    </div>
    
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
      <a href="index.html" style="color: var(--muted); text-decoration: none;">&larr; Volver a la página de inicio</a>
    </div>
  </div>

  <!-- No se necesitan los modales globales aquí -->

  <script src="app.js"></script>
</body>
</html>
