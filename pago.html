<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registrar Pago</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="messageBox" class="message" aria-live="polite" style="display:none"></div>

  <header class="header">
    <div class="brand">
      <h1>Consultorio Médico</h1>
      <p class="subtitle">Agenda e Historial de Pacientes</p>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="paciente.html" class="nav-link">Registrar Paciente</a>
      <a href="historial.html" class="nav-link">Historial</a>
      <a href="receta.html" class="nav-link">Receta</a>
      <a href="pago.html" class="nav-link active">Pago</a>
      <a href="diagnostico.html" class="nav-link">Diagnóstico</a>
      <a href="estudio.html" class="nav-link">Estudio</a>
      <a href="reporte.html" class="nav-link">Reporte</a>
      <a href="config.html" class="nav-link">Configuración</a>
    </nav>
  </header>

  <main class="form-container">
    <form id="paymentForm" class="card">
      <fieldset>
        <legend>Registro de Pago de Consulta</legend>
        <label>Paciente
          <select id="patientSelect" required>
            <option value="">Cargando pacientes...</option>
          </select>
        </label>
        <label>Tipo de Consulta
            <input id="paymentConcept" type="text" value="Consulta de Traumatología" required />
        </label>
        <label>Método de Pago
            <select id="paymentMethod" required>
                <option>Efectivo</option>
                <option>Transferencia Bancaria</option>
                <option>Tarjeta de Crédito/Débito</option>
                <option>Otro</option>
            </select>
        </label>
        <div id="paymentMethodOtherContainer" style="display:none; margin-top: -0.5rem; margin-bottom: 1rem;">
            <label>Especifique otro método
                <input id="paymentMethodOther" type="text" placeholder="Ej. Cheque, PayPal" />
            </label>
        </div>
        <div id="facturacionContainer" style="display: none; border: 1px solid #eee; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
            <label class="checkbox-item" style="display: inline-flex; margin-right: 1rem;" for="paymentFacturado">
                <input type="checkbox" id="paymentFacturado" style="display: none;">
                <span>¿Facturado?</span>
            </label>
            <label class="checkbox-item" id="facturaEmitidaContainer" style="display: none;" for="paymentFacturaEmitida">
                <input type="checkbox" id="paymentFacturaEmitida" style="display: none;">
                <span>¿Factura Emitida?</span>
            </label>
        </div>
        <div class="currency-input">
            <label>Cantidad (MXN)
                <input id="paymentAmount" type="number" step="0.01" placeholder="800.00" required />
            </label>
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="submit" class="btn primary">Guardar y Generar Recibo</button>
      </div>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
